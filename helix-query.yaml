indices:
  default:
    include:
      - "/**"
    target: /query-index.json
    properties:
      title:
        select: "head > title"
        value: |
          match(el, "(.*)")
      description:
        select: "meta[name='description']"
        value: |
          attribute(el, "content")
      image:
        select: "meta[property='og:image']"
        value: |
          attribute(el, "content")
      lastModified:
        select: "none"
        value: |
          parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")