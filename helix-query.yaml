indices:
  # ここで指定した名前がJSONのファイル名になります（query-indexにすると /query-index.json になる）
  query-index:
    include:
      - '/**'
    source: html
    properties:
      # 最低限必要なプロパティをここで定義します
      title:
        select: 'head > meta[property="og:title"]'
        value: attribute(el, "content")
      description:
        select: 'head > meta[name="description"]'
        value: attribute(el, "content")
      image:
        select: 'head > meta[property="og:image"]'
        value: attribute(el, "content")